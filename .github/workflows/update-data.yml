name: Update Inflation Data

on:
  schedule:
    # Run every Monday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:  # Allow manual trigger

# Grant write permission to push commits
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Fetch latest inflation data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}  # optional; unkeyed BLS API works for ~10y window
        run: |
          python scripts/fetch_historical_cpi.py
          python scripts/fetch_imf_forecasts.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/
          git commit -m "Update inflation data $(date +'%Y-%m-%d')"
          git push

      - name: Send email notification
        if: steps.changes.outputs.changed == 'true' && env.RESEND_API_KEY != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ -n "$NOTIFICATION_EMAIL" ]; then
            pip install resend
            python -c "
          import resend, os
          resend.api_key = os.environ['RESEND_API_KEY']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': 'FRED/ECB data updated',
              'text': 'New CPI data was fetched from FRED/ECB and committed to the dashboard.'
          })
          "
          fi

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✅ Data updated and pushed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new data - nothing to update" >> $GITHUB_STEP_SUMMARY
          fi
