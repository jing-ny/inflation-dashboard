name: Update Inflation Data

on:
  schedule:
    # Run every Monday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:  # Allow manual trigger

# Grant write permission to push commits
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Fetch latest inflation data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_historical_cpi.py

      - name: Copy data to docs folder
        run: |
          cp data/historical_cpi.json docs/data/

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/data/historical_cpi.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/historical_cpi.json
          git commit -m "Update inflation data $(date +'%Y-%m-%d')"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✅ Data updated and pushed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new data - nothing to update" >> $GITHUB_STEP_SUMMARY
          fi
