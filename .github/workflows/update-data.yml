name: Update Inflation Data

on:
  schedule:
    # Run every Monday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 1'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      country:
        description: 'Single country code to fetch (e.g. AU); blank = all'
        required: false
        type: string
      dry_run:
        description: 'Dry run — fetch only, no file writes / commit'
        type: boolean
        default: false

# Grant write permission to push commits
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv pdfplumber

      - name: Fetch latest inflation data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}  # optional; unkeyed BLS API works for ~10y window
        run: |
          CMD="python scripts/fetch_historical_cpi.py"
          if [ -n "${{ inputs.country }}" ]; then CMD="$CMD --country ${{ inputs.country }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then CMD="$CMD --dry-run"; fi
          echo "Running: $CMD"
          $CMD
          # Only run the (full) IMF refresh on the normal all-country live run,
          # not on a targeted/dry-run dispatch.
          if [ -z "${{ inputs.country }}" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            python scripts/fetch_imf_forecasts.py
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet docs/data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/
          git commit -m "Update inflation data $(date +'%Y-%m-%d')"
          git push

      - name: Send email notification
        if: steps.changes.outputs.changed == 'true' && env.RESEND_API_KEY != ''
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$NOTIFICATION_EMAIL" ]; then
            pip install resend
            COMMIT_SHA=$(git rev-parse HEAD)
            export COMMIT_SHA
            python <<'PY'
          import json, os, pathlib, resend

          repo = os.environ.get('REPO', '')
          sha = os.environ.get('COMMIT_SHA', '')
          short_sha = sha[:7] if sha else '?'

          data = json.loads(pathlib.Path("docs/data/historical_cpi.json").read_text())
          meta = data.get("metadata", {})
          last_updated = meta.get("last_updated", "?")

          rows = []
          for code, country in data.items():
              if code == "metadata" or not isinstance(country, dict):
                  continue
              latest = country.get("latest") or {}
              if not latest:
                  continue
              flag = country.get("flag", "")
              target = country.get("target")
              target_str = f"target {target}%" if target is not None else ""
              rows.append(
                  f"  {flag} {code}: {latest.get('value','?')}% "
                  f"({latest.get('date','?')}) {target_str}".rstrip()
              )

          commit_url = f"https://github.com/{repo}/commit/{sha}" if repo and sha else ""
          subject = f"CPI data updated — {last_updated} ({short_sha})"

          body_parts = [
              f"FRED/ECB/BLS/ONS/StatCan pull completed for {last_updated} ({short_sha}).",
              f"Commit: {commit_url}" if commit_url else "",
              "",
              "Latest YoY by country:",
              *rows,
          ]
          body = "\n".join(p for p in body_parts if p is not None)

          resend.api_key = os.environ['RESEND_API_KEY']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': subject,
              'text': body,
          })
          PY
          fi

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "✅ Data updated and pushed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No new data - nothing to update" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send failure alert email
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "Notification secrets not set; skipping failure alert"
            exit 0
          fi
          pip install --quiet resend
          python <<'PY'
          import os, resend
          resend.api_key = os.environ['RESEND_API_KEY']
          run_url = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          workflow = os.environ['WORKFLOW']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': f"❌ {workflow} failed",
              'text': (
                  f"GitHub Actions workflow '{workflow}' failed on the most recent run.\n\n"
                  f"Run URL: {run_url}\n\n"
                  "Click through to see which step(s) failed and view the logs.\n"
              ),
          })
          PY
