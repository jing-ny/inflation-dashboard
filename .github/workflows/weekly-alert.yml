name: Weekly Alert

on:
  schedule:
    # Run every Monday at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email, no snapshot save)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  weekly-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run weekly alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_RECIPIENTS: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          CMD="python scripts/send_weekly_alert.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          $CMD

      - name: Commit snapshot if changed
        if: inputs.dry_run != true
        run: |
          if git diff --quiet docs/data/weekly_snapshots.json 2>/dev/null; then
            echo "No snapshot changes"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add docs/data/weekly_snapshots.json
            git commit -m "Update weekly snapshot $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Summary
        run: |
          echo "## Weekly Alert Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.dry_run == true && 'Dry Run' || 'Live' }}" >> $GITHUB_STEP_SUMMARY
