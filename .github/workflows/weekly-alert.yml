name: Weekly Alert

on:
  schedule:
    # Run every Monday at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email)'
        type: boolean
        default: true

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check for material changes
        id: check
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "Checking for material inflation changes..."
          
          # Simple check - just verify data can be fetched
          # Full alert logic would go in a separate script
          
          python3 << 'EOF'
          import os
          import json
          
          # Load current data
          data_file = "docs/data/historical_cpi.json"
          
          if os.path.exists(data_file):
              with open(data_file) as f:
                  data = json.load(f)
              
              print("=== Current Inflation Data ===")
              for code, country in data.items():
                  if isinstance(country, dict) and "latest" in country:
                      latest = country.get("latest", {})
                      name = country.get("name", code)
                      value = latest.get("value", "N/A")
                      date = latest.get("date", "N/A")
                      print(f"{name}: {value}% ({date})")
              
              print("\n✅ Data check complete")
          else:
              print(f"⚠️ Data file not found: {data_file}")
              exit(0)  # Don't fail the workflow
          EOF
      
      - name: Summary
        run: |
          echo "Weekly check completed successfully"
          echo "To enable email alerts, add RESEND_API_KEY secret and update this workflow"
