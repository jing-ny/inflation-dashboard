name: Weekly Alert

on:
  schedule:
    # Run every Monday at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no email, no snapshot save)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  weekly-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run weekly alert
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_RECIPIENTS: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          CMD="python scripts/send_weekly_alert.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          $CMD

      - name: Commit snapshot if changed
        if: inputs.dry_run != true
        run: |
          if git diff --quiet docs/data/weekly_snapshots.json 2>/dev/null; then
            echo "No snapshot changes"
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add docs/data/weekly_snapshots.json
            git commit -m "Update weekly snapshot $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Summary
        run: |
          echo "## Weekly Alert Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.dry_run == true && 'Dry Run' || 'Live' }}" >> $GITHUB_STEP_SUMMARY

      - name: Send failure alert email
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "Notification secrets not set; skipping failure alert"
            exit 0
          fi
          pip install --quiet resend
          python <<'PY'
          import os, resend
          resend.api_key = os.environ['RESEND_API_KEY']
          run_url = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          workflow = os.environ['WORKFLOW']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': f"❌ {workflow} failed",
              'text': (
                  f"GitHub Actions workflow '{workflow}' failed on the most recent run.\n\n"
                  f"Run URL: {run_url}\n\n"
                  "Click through to see which step(s) failed and view the logs.\n"
              ),
          })
          PY
