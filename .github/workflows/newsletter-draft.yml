name: Newsletter Draft

on:
  schedule:
    # Run on the 1st of each month at 2pm UTC (10am EST)
    - cron: '0 14 1 * *'
  push:
    branches: [main]
    paths:
      - 'docs/data/historical_cpi.json'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit, no email)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  newsletter-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests python-dotenv

      # Cheap and offline — runs before the API call so a broken verifier is
      # caught without spending a generation.
      - name: Verifier regression tests
        run: python scripts/test_newsletter_verify.py

      - name: Generate newsletter draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional repo variable — set it to pin a different model without
          # touching the script (e.g. when a model ID is retired).
          NEWSLETTER_MODEL: ${{ vars.NEWSLETTER_MODEL }}
        run: |
          CMD="python scripts/generate_newsletter.py"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          $CMD

      - name: Commit draft if generated
        id: commit
        if: inputs.dry_run != true
        run: |
          if [ -z "$(git status --porcelain docs/drafts/)" ]; then
            echo "No new draft files"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add docs/drafts/
            git commit -m "Add newsletter draft $(date +'%Y-%m-%d')"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        if: steps.commit.outputs.committed == 'true' && inputs.dry_run != true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$NOTIFICATION_EMAIL" ]; then
            pip install resend
            COMMIT_SHA=$(git rev-parse HEAD)
            export COMMIT_SHA
            python <<'PY'
          import os, pathlib, re, resend

          repo = os.environ.get('REPO', '')
          sha = os.environ.get('COMMIT_SHA', '')
          short_sha = sha[:7] if sha else '?'

          # Pick the most recently modified newsletter draft. The default name
          # is newsletter_YYYY-MM-DD.md but --output can override; glob the dir
          # and take the freshest match either way.
          drafts_dir = pathlib.Path("docs/drafts")
          candidates = sorted(
              drafts_dir.glob("newsletter_*.md"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          if not candidates:
              candidates = sorted(
                  drafts_dir.glob("*.md"),
                  key=lambda p: p.stat().st_mtime,
                  reverse=True,
              )
          draft_path = candidates[0] if candidates else None
          draft_text = draft_path.read_text(encoding='utf-8') if draft_path else ""

          # Extract the issue date from the filename (newsletter_YYYY-MM-DD.md)
          # or fall back to the H1 line, or the commit date.
          date_label = "?"
          if draft_path:
              m = re.search(r'(\d{4}-\d{2}-\d{2})', draft_path.name)
              if m:
                  date_label = m.group(1)
              else:
                  first_line = draft_text.splitlines()[0] if draft_text else ""
                  m = re.search(r'(\d{4}-\d{2}-\d{2})', first_line)
                  if m:
                      date_label = m.group(1)

          commit_url = f"https://github.com/{repo}/commit/{sha}" if repo and sha else ""
          file_url = (f"https://github.com/{repo}/blob/{sha}/{draft_path.as_posix()}"
                      if repo and sha and draft_path else "")

          subject = f"Newsletter draft — {date_label} ({short_sha})"

          header_lines = [
              f"A new inflation newsletter draft was generated and committed ({short_sha}).",
              f"File: {draft_path.as_posix()}" if draft_path else "",
              f"View on GitHub: {file_url}" if file_url else "",
              f"Commit: {commit_url}" if commit_url else "",
              "",
              "Review the draft below and decide whether to send to subscribers.",
              "─" * 60,
              "",
          ]
          body = "\n".join(p for p in header_lines if p is not None) + (
              draft_text or "(no draft file found on disk)"
          )

          resend.api_key = os.environ['RESEND_API_KEY']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': subject,
              'text': body,
          })
          PY
          else
            echo "No RESEND_API_KEY or NOTIFICATION_EMAIL set, skipping"
          fi

      - name: Summary
        run: |
          echo "## Newsletter Draft Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.dry_run == true && 'Dry Run' || 'Live' }}" >> $GITHUB_STEP_SUMMARY

      - name: Send failure alert email
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "Notification secrets not set; skipping failure alert"
            exit 0
          fi
          pip install --quiet resend
          python <<'PY'
          import os, resend
          resend.api_key = os.environ['RESEND_API_KEY']
          run_url = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          workflow = os.environ['WORKFLOW']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': f"❌ {workflow} failed",
              'text': (
                  f"GitHub Actions workflow '{workflow}' failed on the most recent run.\n\n"
                  f"Run URL: {run_url}\n\n"
                  "Click through to see which step(s) failed and view the logs.\n"
              ),
          })
          PY
