name: Auto-Scrape CB Forecasts

on:
  schedule:
    # Run every Monday and Thursday at 10:00 UTC
    - cron: '0 10 * * 1,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update (ignore publication cache)'
        type: boolean
        default: false
      country:
        description: 'Specific country to check (US, JP, BR, AU, EA, UK, CA, NZ, ZA, SG, or leave blank for all)'
        type: string
        required: false
      dry_run:
        description: 'Dry run (check only, no updates)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape-forecasts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pdfplumber

      - name: Run auto-scraper
        id: scrape
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "=== Starting Central Bank Forecast Scraper ==="
          
          CMD="python scripts/auto_scrape_cb_forecasts.py --merge"

          if [ "${{ inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          
          if [ -n "${{ inputs.country }}" ]; then
            CMD="$CMD --country ${{ inputs.country }}"
          fi
          
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          
          echo "Running: $CMD"
          $CMD | tee scraper_output.txt
          
          if grep -q "Updates found: [1-9]" scraper_output.txt; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: changes
        if: inputs.dry_run != true
        run: |
          # We commit on any of three artifacts changing:
          #   - cb_forecasts.json (auto-merged updates)
          #   - cb_forecasts_draft.json (>1pp jumps routed to draft review, #32)
          #   - cb_forecasts_changes.md (per-merge summary)
          # so that pending drafts become visible to the dashboard, not just
          # the email recipient.
          #
          # Use `git status --porcelain`, NOT `git diff`: the draft + changes
          # files are only written when a >1pp jump trips the gate, so they're
          # often absent. `git diff <missing-path>` exits 128 ("no such path
          # in the working tree") and fails the run. `git status --porcelain`
          # tolerates absent paths AND detects newly-created untracked files
          # (which `git diff` would miss entirely — a draft-only change would
          # otherwise be a false-negative).
          changed_status="$(git status --porcelain -- \
            docs/data/cb_forecasts.json \
            docs/data/cb_forecasts_draft.json \
            docs/data/cb_forecasts_changes.md 2>/dev/null)"
          if [ -z "$changed_status" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "$changed_status"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage only files that actually exist — draft + changes are
          # written only when a >1pp jump is detected.
          for path in \
              docs/data/cb_forecasts.json \
              docs/data/cb_forecasts_draft.json \
              docs/data/cb_forecasts_changes.md; do
            if [ -f "$path" ]; then
              git add "$path"
            fi
          done

          UPDATED=$(grep "Updated:" scraper_output.txt | head -1 || echo "Updated: auto")
          git commit -m "Auto-update CB forecasts $(date +'%Y-%m-%d')

          $UPDATED

          Automated scrape of central bank forecast publications."

          git push

      - name: Send email notification
        if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$NOTIFICATION_EMAIL" ]; then
            pip install resend
            COMMIT_SHA=$(git rev-parse HEAD)
            export COMMIT_SHA
            python <<'PY'
          import os, re, pathlib, resend

          repo = os.environ.get('REPO', '')
          sha = os.environ.get('COMMIT_SHA', '')
          short_sha = sha[:7] if sha else '?'

          changes_path = pathlib.Path("docs/data/cb_forecasts_changes.md")
          summary = changes_path.read_text(encoding='utf-8') if changes_path.exists() else ""

          # Pull country codes out of summary headings: "### Bank Name (XX)"
          countries = re.findall(r'^###\s+.*?\(([A-Z]{2,3})\)', summary, re.M)
          country_list = ", ".join(dict.fromkeys(countries)) or "unknown"

          commit_url = f"https://github.com/{repo}/commit/{sha}" if repo and sha else ""
          subject = f"CB forecasts updated — {country_list} ({short_sha})"

          body_parts = [
              f"Auto-scraper committed forecast updates ({short_sha}).",
              f"Commit: {commit_url}" if commit_url else "",
              "",
              summary or "(no cb_forecasts_changes.md on disk; check the workflow log)",
              "",
              "Changes >1pp/year are blocked from auto-merge and routed to "
              "docs/data/cb_forecasts_draft.json for manual review.",
          ]
          body = "\n".join(p for p in body_parts if p is not None)

          resend.api_key = os.environ['RESEND_API_KEY']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': subject,
              'text': body,
          })
          PY
          fi

      - name: Summary
        run: |
          echo "## Central Bank Forecast Scraper Results" >> $GITHUB_STEP_SUMMARY
          echo "**Run time:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.dry_run == true && 'Dry Run' || 'Live' }}" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "✅ **Updates committed and pushed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No updates needed**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send failure alert email
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$RESEND_API_KEY" ] || [ -z "$NOTIFICATION_EMAIL" ]; then
            echo "Notification secrets not set; skipping failure alert"
            exit 0
          fi
          pip install --quiet resend
          python <<'PY'
          import os, resend
          resend.api_key = os.environ['RESEND_API_KEY']
          run_url = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}"
          workflow = os.environ['WORKFLOW']
          resend.Emails.send({
              'from': 'Inflation Dashboard <onboarding@resend.dev>',
              'to': os.environ['NOTIFICATION_EMAIL'],
              'subject': f"❌ {workflow} failed",
              'text': (
                  f"GitHub Actions workflow '{workflow}' failed on the most recent run.\n\n"
                  f"Run URL: {run_url}\n\n"
                  "Click through to see which step(s) failed and view the logs.\n"
              ),
          })
          PY
