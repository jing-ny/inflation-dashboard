name: Auto-Scrape CB Forecasts

on:
  schedule:
    # Run every Monday at 10 AM UTC (after main data update at 9 AM)
    - cron: '0 10 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape-and-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run auto-scrape script
        run: python scripts/auto_scrape_cb_forecasts.py
        continue-on-error: true  # Don't fail workflow if scraping has issues
      
      - name: Check for draft file
        id: check_draft
        run: |
          if [ -f "data/cb_forecasts_draft.json" ]; then
            echo "draft_exists=true" >> $GITHUB_OUTPUT
          else
            echo "draft_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check_draft.outputs.draft_exists == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Auto-scrape CB forecasts draft - $(date +'%Y-%m-%d')"
          title: "🤖 CB Forecast Update Draft - Review Required"
          body: |
            ## Automated Central Bank Forecast Extraction
            
            This PR contains auto-extracted central bank inflation forecasts.
            
            **⚠️ IMPORTANT: Review before merging!**
            
            The extraction uses pattern matching and may contain errors. Please:
            
            1. Review `data/cb_forecasts_changes.md` for a summary
            2. Check `data/cb_forecasts_draft.json` values against source URLs
            3. If values are correct:
               - Copy draft to `data/cb_forecasts.json`
               - Copy to `docs/data/cb_forecasts.json`
               - Delete the draft files
            4. If values are wrong:
               - Close this PR
               - Update manually
            
            ---
            
            *Generated by auto_scrape_cb_forecasts.py*
          branch: auto-cb-forecasts-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            needs-review
            cb-forecasts
      
      - name: Summary
        run: |
          echo "## CB Forecast Auto-Scrape Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "data/cb_forecasts_changes.md" ]; then
            cat data/cb_forecasts_changes.md >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes file generated." >> $GITHUB_STEP_SUMMARY
          fi
