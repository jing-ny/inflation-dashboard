<!DOCTYPE html>
<html lang="en">
<head>

    <title>Release Calendar — Inflation, Officially</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav">

    <main class="container">
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">Upcoming CPI Releases</h2>
                <p class="section-subtitle">Next expected print per country, projected from each agency's typical publication lag</p>
            </div>

                <thead>
                    <tr>
                        <th>Country</th>
                        <th>Next Release</th>
                        <th>Cadence</th>

                <tbody id="calendarTableBody">
                    <tr><td colspan="6">Loading...</td></tr>
                </tbody>
            </table>
            <p class="freshness-footer" id="calendarNote"></p>

    </main>

    <footer class="footer">
